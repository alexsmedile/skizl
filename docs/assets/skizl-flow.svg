<svg width="100%" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="700" rx="12" fill="#ffffff"/>

<!-- Title -->
<text x="340" y="36" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">/skilz</text>
<text x="340" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Pack, unpack, pin. Copy-only — source files are never modified.</text>

<!-- Step 1: pack -->
<rect x="200" y="76" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">pack</text>
<text x="340" y="114" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">Combine standalone skills → container</text>

<line x1="340" y1="132" x2="340" y2="152" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 2: unpack -->
<rect x="200" y="156" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">unpack</text>
<text x="340" y="194" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Restore container actions → standalone skills</text>

<line x1="340" y1="212" x2="340" y2="232" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 3: pin -->
<rect x="200" y="236" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">pin</text>
<text x="340" y="274" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">i-&lt;action&gt; shortcut → delegates to container</text>

<line x1="340" y1="292" x2="340" y2="312" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="356" y="306" font-family="sans-serif" font-size="11" fill="#999">optional</text>

<!-- Step 4: unpin -->
<rect x="200" y="316" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="340" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">unpin</text>
<text x="340" y="354" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Remove i-&lt;action&gt; shortcut</text>

<!-- Left phase labels -->
<text x="188" y="104" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5F5E5A">consolidate</text>
<text x="188" y="184" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5F5E5A">expand</text>
<text x="188" y="264" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5F5E5A">shortcut</text>
<text x="188" y="344" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5F5E5A">clean up</text>

<!-- Container architecture callout -->
<rect x="200" y="400" width="280" height="100" rx="8" fill="#F7F7F5" stroke="#CCCCCC" stroke-width="0.5"/>
<text x="340" y="422" text-anchor="middle" font-family="monospace" font-size="11" fill="#444">skills/&lt;master-skill&gt;/</text>
<text x="225" y="440" font-family="monospace" font-size="11" fill="#444">├── SKILL.md        ← auto-loaded</text>
<text x="225" y="456" font-family="monospace" font-size="11" fill="#444">├── references/     ← loaded on invoke</text>
<text x="225" y="472" font-family="monospace" font-size="11" fill="#444">├── knowledge/      ← shared context</text>
<text x="225" y="488" font-family="monospace" font-size="11" fill="#444">└── scripts/pin.mjs</text>

<!-- Caption -->
<text x="340" y="540" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">All operations are non-destructive. pack and unpack are copy operations.</text>
<text x="340" y="558" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Free text is interpreted — skilz infers intent and asks for confirmation.</text>

<!-- Legend -->
<rect x="114" y="590" width="16" height="16" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="138" y="602" font-family="sans-serif" font-size="12" fill="#5F5E5A">Pack</text>
<rect x="210" y="590" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="234" y="602" font-family="sans-serif" font-size="12" fill="#5F5E5A">Unpack</text>
<rect x="318" y="590" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="342" y="602" font-family="sans-serif" font-size="12" fill="#5F5E5A">Pin</text>
<rect x="404" y="590" width="16" height="16" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="428" y="602" font-family="sans-serif" font-size="12" fill="#5F5E5A">Unpin</text>

</svg>
