<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Container box -->
  <rect x="8" y="20" width="48" height="34" rx="5" ry="5" fill="#1a1a2e" stroke="#6c63ff" stroke-width="2"/>

  <!-- Lid / top panel -->
  <rect x="6" y="13" width="52" height="12" rx="4" ry="4" fill="#6c63ff"/>

  <!-- Lid highlight line -->
  <line x1="6" y1="25" x2="58" y2="25" stroke="#1a1a2e" stroke-width="1.5"/>

  <!-- Stacked skill lines inside box -->
  <rect x="16" y="32" width="32" height="4" rx="2" fill="#6c63ff" opacity="0.9"/>
  <rect x="16" y="40" width="24" height="4" rx="2" fill="#6c63ff" opacity="0.6"/>
  <rect x="16" y="48" width="16" height="4" rx="2" fill="#6c63ff" opacity="0.3"/>

  <!-- Pack arrow: down-into-box -->
  <polyline points="32,2 32,11" stroke="#a89cff" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="28,7 32,11 36,7" stroke="#a89cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
